name: Publish scan

on:
  pull_request:
    paths:
      - src/publish/**
      - test/publish/**
      - src/memory/sensitive.js
      - test/memory/sensitive.test.js
      - .github/workflows/publish-scan.yml
  push:
    branches: [main]
    paths:
      - src/publish/**
      - test/publish/**
      - src/memory/sensitive.js
      - test/memory/sensitive.test.js
      - .github/workflows/publish-scan.yml

permissions:
  contents: read

jobs:
  scan:
    name: scan (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # 20 is the oldest runtime we target (VS Code's extension host); 24 is current.
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --omit=dev --ignore-scripts
      - run: node --check src/publish/scan.js
      - run: node --check src/publish/diff.js
      - run: node --check src/publish/detectors.js
      # Node 20 cannot expand globs itself, so the shell does it (bash on Windows too).
      - run: node --test test/publish/*.test.js test/memory/sensitive.test.js
        shell: bash
