name: Private storage

on:
  pull_request:
    paths:
      - src/storage/**
      - src/shared/**
      - test/storage/**
      - test/shared/**
      - scripts/p0/check-private-storage.js
      - .github/workflows/private-storage.yml
  push:
    branches: [main]
    paths:
      - src/storage/**
      - src/shared/**
      - test/storage/**
      - test/shared/**
      - scripts/p0/check-private-storage.js
      - .github/workflows/private-storage.yml

permissions:
  contents: read

jobs:
  storage:
    name: storage (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # 20 is the oldest runtime we target (VS Code's extension host); 24 is current.
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      # Node 20 cannot expand globs itself, so the shell does it (bash on Windows too).
      - run: node --test test/storage/*.test.js
        shell: bash
      - run: node scripts/p0/check-private-storage.js --repo .
      - run: node --test test/shared/*.test.js
        shell: bash
      # Four processes contend for one lock in the cross-process write test. It once failed
      # intermittently on a Windows runner, so it is repeated: a flaky lock shows up as a red
      # job here, with the reason, instead of as a rare surprise later.
      - name: Repeat the cross-process write test 20 times
        shell: bash
        run: |
          for i in $(seq 1 20); do
            if ! node --test --test-name-pattern="concurrent processes all land" test/storage/private-store.test.js > "$RUNNER_TEMP/repeat.log" 2>&1; then
              echo "run $i of 20 failed"
              cat "$RUNNER_TEMP/repeat.log"
              exit 1
            fi
          done
          echo "storage cross-process write test passed 20 of 20 runs"
