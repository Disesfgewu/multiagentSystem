name: Git worktrees

on:
  pull_request:
    paths:
      - src/projects/**
      - test/projects/**
      - .github/workflows/worktrees.yml
  push:
    branches: [main]
    paths:
      - src/projects/**
      - test/projects/**
      - .github/workflows/worktrees.yml

permissions:
  contents: read

jobs:
  worktrees:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test test/projects/worktrees.test.js
