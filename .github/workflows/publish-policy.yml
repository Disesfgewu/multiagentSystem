name: Publish policy

on:
  pull_request:
    paths:
      - src/publish-policy.js
      - test/publish-policy.test.js
      - .github/workflows/publish-policy.yml
  push:
    branches: [main, feat/p0-publish-policy]
    paths:
      - src/publish-policy.js
      - test/publish-policy.test.js
      - .github/workflows/publish-policy.yml

permissions:
  contents: read

jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test test/publish-policy.test.js
